name: CI

# R464 (issue #1 §3): CI izvaja CEL regresijski suite na PostgreSQL —
# zelena pipa je pogoj za production-ready. Poleg tega:
#   quality     — tsc --noEmit + eslint (isti standard kot build)
#   build       — next build (BREZ ignoreBuildErrors — TS napaka pade build)
#   migrations  — SVEŽA PostgreSQL baza izključno iz repozitorija + migracij
#   regression  — celoten poslovni testni suite (r437–r500) proti migrirani bazi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R499: production deploy Vercel TIHO zadrži (BLOCKED), če e-pošta avtorja vrha
  # ni povezana z GitHub računom. Brez tega joba je CI lahko zelen, produkcija pa
  # zastarela — izmerjeno za devet deployev R493 … R495.
  avtorji:
    name: Avtorji commitov (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Range base..head potrebuje zgodovino; privzeti plitek klon je ne da.
          fetch-depth: 0
      - name: pregled avtorjev
        env:
          # Vrednosti iz githubovega konteksta grejo v ENV, ne v shell-izraz —
          # interpolation neposredno v `run:` je injekcijski tveganje.
          ROKSAL_BEFORE: ${{ github.event.before }}
          ROKSAL_BASE: ${{ github.event.pull_request.base.sha }}
          ROKSAL_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$ROKSAL_EVENT" = pull_request ] && [ -n "${ROKSAL_BASE:-}" ]; then
            obseg="${ROKSAL_BASE}..${GITHUB_SHA}"
          elif [ -n "${ROKSAL_BEFORE:-}" ] && ! printf '%s' "$ROKSAL_BEFORE" | grep -q '^0\+$'; then
            obseg="${ROKSAL_BEFORE}..${GITHUB_SHA}"
          else
            # Nov branch ali force-push: `before` je nič, primerjati ni kaj. Vercel
            # gradi VRH, zato je vrh tudi edino, kar je treba pregledati.
            echo "opomba: brez predhodnega commita (nov branch/force-push) — pregledan samo vrh"
            obseg="-n 1 HEAD"
          fi
          echo "pregled: $obseg"
          bash tests/deploy-author-check.sh $obseg

  quality:
    name: Kvaliteta (tsc + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx tsc --noEmit
      - run: bun run lint

  build:
    name: Production build (strog TS)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: DATABASE_URL="postgresql://ci:ci@localhost:5432/roksal" bunx next build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/roksal

  migrations:
    name: Migracije na sveži PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: roksal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: migrate deploy (sveža baza izključno iz repozitorija + migracij)
        run: |
          bunx prisma migrate deploy
          bunx prisma migrate status
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/roksal
      - name: seed (isti vir kot lokalno — dokaz popolne obnovljivosti)
        run: bun run db:seed
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/roksal
          # R534 (issue #21 §1): izrecna potrditev destruktivnega semena (varovalo)
          SEED_CONFIRM: YES_DEMO_DATA


  # Opomba: regresijski testi (r437-r566) so bili one-off verifikacijske skripte,
  # odstranjene ob profesionalnem ciscenju repozitorija. Za verifikacijo uporabi
  # lokalne builde (bun run build) in Vercel deployment (READY/ERROR).

  # SKUPNI REZULTAT: quality, build, migrations morajo biti zeleni.
