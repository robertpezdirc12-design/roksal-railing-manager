name: CI

# R464 (issue #1 §3): CI izvaja CEL regresijski suite na PostgreSQL —
# zelena pipa je pogoj za production-ready. Poleg tega:
#   quality     — tsc --noEmit + eslint (isti standard kot build)
#   build       — next build (BREZ ignoreBuildErrors — TS napaka pade build)
#   migrations  — SVEŽA PostgreSQL baza izključno iz repozitorija + migracij
#   regression  — celoten poslovni testni suite (r437–r500) proti migrirani bazi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R499: production deploy Vercel TIHO zadrži (BLOCKED), če e-pošta avtorja vrha
  # ni povezana z GitHub računom. Brez tega joba je CI lahko zelen, produkcija pa
  # zastarela — izmerjeno za devet deployev R493 … R495.
  avtorji:
    name: Avtorji commitov (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Range base..head potrebuje zgodovino; privzeti plitek klon je ne da.
          fetch-depth: 0
      - name: pregled avtorjev
        env:
          # Vrednosti iz githubovega konteksta grejo v ENV, ne v shell-izraz —
          # interpolation neposredno v `run:` je injekcijski tveganje.
          ROKSAL_BEFORE: ${{ github.event.before }}
          ROKSAL_BASE: ${{ github.event.pull_request.base.sha }}
          ROKSAL_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$ROKSAL_EVENT" = pull_request ] && [ -n "${ROKSAL_BASE:-}" ]; then
            obseg="${ROKSAL_BASE}..${GITHUB_SHA}"
          elif [ -n "${ROKSAL_BEFORE:-}" ] && ! printf '%s' "$ROKSAL_BEFORE" | grep -q '^0\+$'; then
            obseg="${ROKSAL_BEFORE}..${GITHUB_SHA}"
          else
            # Nov branch ali force-push: `before` je nič, primerjati ni kaj. Vercel
            # gradi VRH, zato je vrh tudi edino, kar je treba pregledati.
            echo "opomba: brez predhodnega commita (nov branch/force-push) — pregledan samo vrh"
            obseg="-n 1 HEAD"
          fi
          echo "pregled: $obseg"
          bash tests/deploy-author-check.sh $obseg

  quality:
    name: Kvaliteta (tsc + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx tsc --noEmit
      - run: bun run lint

  build:
    name: Production build (strog TS)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: DATABASE_URL="postgresql://ci:ci@localhost:5432/roksal" bunx next build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/roksal

  migrations:
    name: Migracije na sveži PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: roksal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: migrate deploy (sveža baza izključno iz repozitorija + migracij)
        run: |
          bunx prisma migrate deploy
          bunx prisma migrate status
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/roksal
      - name: seed (isti vir kot lokalno — dokaz popolne obnovljivosti)
        run: bun run db:seed
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/roksal

  regression:
    name: Regresija (${{ matrix.grupa }})
    runs-on: ubuntu-latest
    needs: migrations
    strategy:
      fail-fast: false
      matrix:
        include:
          - grupa: r437-r445
          - grupa: r446-r452
          - grupa: r454-r458
          - grupa: r459-r462
          - grupa: r464
          # R497: skupina je bila v matriki tests/ci-matrix.sh, v workflowu pa ne
          # — tako je bil celoten notification sweep v CI-ju nikoli zagnan.
          - grupa: r464-notifications
          - grupa: r465-r474
          - grupa: r475-r478
          - grupa: r479
          - grupa: r480
          - grupa: r481
          - grupa: r483
          - grupa: r484
          - grupa: r485
          - grupa: r486
          - grupa: r487
          - grupa: r488
          - grupa: r489
          - grupa: r490
          - grupa: r493
          - grupa: r494
          - grupa: r495
          - grupa: r500
          # R501 (issue #15 faza 2): enotna kalibracijska pogodba + strežniški
          # statusi meritev — nova skupina MORA biti tudi v tests/ci-matrix.sh
          # (sicer pas javi razhajanje matrike).
          - grupa: r501
          # R502 (issue #15 faza 3): dokazni protokol fotogrametrije brez AI —
          # rekonstrukcija iz sintetičnega para slik proti znani istini.
          - grupa: r502
          # R503 (issue #15 faza 4+5): izvor domenskih vhodov (VNOS/PRIVZET/
          # PRAVILO), zajemski načrt po tipu objekta in nemogoče geometrije —
          # nova skupina MORA biti tudi v tests/ci-matrix.sh.
          - grupa: r503
          # R504 (issue #14 faza fotozamenjave): maska + obnova ozadja brez AI +
          # izbira preverjenih gradiv iz kataloga — nova skupina MORA biti tudi
          # v tests/ci-matrix.sh.
          - grupa: r504
          # R508 (issue #7): zmožnosti kamere (PODPRTO/NI_PODPRE/NI_DOKAZA),
          # osnutek meritve PO SEJI (brez tihe prepisi) in status shranjevanja
          # korak-na-korak — nova skupina MORA biti tudi v tests/ci-matrix.sh.
          - grupa: r508
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: roksal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/roksal
      TEST_DB_URL: postgresql://ci:ci@localhost:5432/roksal
      BASE_URL: http://localhost:3000
      # R497: ena skupin zna makingati prijave hitreje kot produkcijska meja
      # 30/min/IP (izmerjeno na lokalnem pasu: 429 v zadnjih skupinah). Testni
      # pregleduje aplikacijo, ne zavore, zato je odprta; produkcija ostane 30.
      AUTH_RATE_MAX: 100000
    steps:
      - uses: actions/checkout@v4
        with:
          # R466: r441 backup/restore test dela git bundle --all + clone iz
          # bundle — shallow klon (privzeti fetch-depth:1) da neuporaben bundle
          # ("did not send all necessary objects", ugotovitev R464)
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: priprava baze (migrate + popoln seed)
        run: |
          bunx prisma migrate deploy
          bun run db:seed
      - name: sistemski paketi (poppler-utils — pdftotext za teste PDF)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: zagon aplikacije
        # R497: Next 16 dovoli EN sam `next dev` na projektno mapo (blokada
        # .next/dev/lock). Skupina r464-notifications si strežnik na :3031 zažene
        # SAMa (faze A–D potrebujejo različen process.env), zato njen job ne sme
        # vžgati skupnega na :3000 — sicer blokada zadrži testni strežnik in
        # skupina pade na health timeoutu.
        if: matrix.grupa != 'r464-notifications'
        run: |
          bunx next dev -p 3000 > dev.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 2
            if curl -sf http://localhost:3000/api/public/health > /dev/null; then
              echo "aplikacija pripravljena"; exit 0
            fi
          done
          echo "aplikacija se ni zagnala"; cat dev.log | tail -30; exit 1
      - name: izvedba regresijskih testov
        run: bash tests/ci-matrix.sh "${{ matrix.grupa }}"
      - name: povzetek napak (če so)
        if: failure()
        run: for f in /tmp/reg-*.log; do echo "── $f:"; tail -20 "$f"; done

  # SKUPNI REZULTAT: vsi jobi morajo biti zeleni, da je MR production-ready.
  # Branch protection na GitHubu naj ima zahtevane checke: quality, build,
  # migrations, regression (vseh 5 grup).
