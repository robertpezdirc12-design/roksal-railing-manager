# GitLab CI — Roksal Manager (R441 / issue #3: DISASTER RECOVERY & SECURITY)
#
# GitLab je kanonični razvojni vir:
#   • main je zaščiten — direktni push ONEMOGOČEN, spremembe samo skozi merge request;
#   • merge zahteva ZELENO cevovodno preverjanje (only_allow_merge_if_pipeline_succeeds);
#   • produkcijske verzije označujemo z zavarovanimi tagi v* + GitLab release.
#
# Vratarji (vsak mora biti zelen pred merge):
#   1. bun install --frozen-lockfile — odvisnosti deterministično iz bun.lock
#   2. bun run lint                 — ESLint (kakovost kode)
#   3. tsc --noEmit                 — tipovna preveritev aplikacije (tsconfig.ci.json)
#   4. prisma validate + db push    — shema je veljavna in se čisto uveljavi v prazno bazo
#   5. ops/secret-audit.sh          — v repozitoriju NI žetonov/ključev (delovna kopija + zgodovina)
#   6. bash -n ops/*.sh             — sintaksa operacijskih skript
#
# R497: točka 4 je bila pokvarjena — `DATABASE_URL="file:/tmp/ci-schema.db"` je
# ostal iz SQLite obdobja, `prisma/schema.prisma` pa ima od R464 provider
# `postgresql`. Posledica: cevovod pade na `prisma db push` (prizadet je vsak MR,
# torej tudi varnostni popravki). Zdaj ima job pravi PostgreSQL servis.
#
# Namensko NE gradimo produkcijskega paketa v CI (orta tipa + shema sta vratarja;
# polna gradnja poteče pri deployu — glej docs/RECOVERY.md). Regression suite
# (tests/ci-matrix.sh) tu NE teče — rabi živo aplikacijo s seedanimi podatki;
# lokalno ga poganja `bash tests/ci-local.sh`, v GitHub Actions pa matrika ci.yml.

stages: [verify]

default:
  image: oven/bun:1

verify:
  stage: verify
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    # pri PostgreSQL servisu GitLab nastavi samo POSTGRES_*; gostitelj je alias
    POSTGRES_DB: roksal
    POSTGRES_USER: roksal
    POSTGRES_PASSWORD: roksal
    DATABASE_URL: "postgresql://roksal:roksal@postgres:5432/roksal"
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules/
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates postgresql-client >/dev/null
    # servis vzpostavi TLS-neranen TCP prikladen — počakaj, dokler NE sprejme poizvedbe
    - |
      for i in $(seq 1 30); do
        if pg_isready -h postgres -U roksal >/dev/null 2>&1; then break; fi
        sleep 2
      done
      pg_isready -h postgres -U roksal || { echo "✗ postgres servis ne odgovori"; exit 1; }
    - bun install --frozen-lockfile
    - bun run lint
    - bunx tsc --noEmit -p tsconfig.ci.json
    - bunx prisma validate
    - bunx prisma db push --skip-generate
    - bash ops/secret-audit.sh
    - bash -n ops/*.sh
